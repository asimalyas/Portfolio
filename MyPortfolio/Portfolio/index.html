<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website title -->
    <title>Asim Alyas Rathore | Portfolio</title>

    <!-- SEO and Social Media -->
    <meta name="description" content="Portfolio of Asim Alyas Rathore – Software Engineer, Web Developer, ML Engineer, and Problem Solver." />
    <meta name="author" content="Asim Alyas Rathore" />
    <meta name="keywords" content="Asim Alyas, Software Engineer, Web Developer, React, Machine Learning, Portfolio" />

    <!-- Open Graph (for Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Asim Alyas Rathore | Portfolio" />
    <meta property="og:description" content="Explore my projects, achievements, and skills in web development, machine learning, and software engineering." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Preload font for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent FOUC on theme -->
    <script>
      (function() {
        var t = localStorage.getItem('portfolio-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      })();
    </script>
  </head>

  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to view this portfolio.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
